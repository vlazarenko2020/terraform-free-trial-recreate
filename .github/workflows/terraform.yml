name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write # Allows posting plan comments on PRs

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    # Map environment variables from GitHub Secrets so Terraform/Providers can read them
    env:
      # AWS_REGION: ${{ secrets.AWS_REGION }}


      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}


      # - variables that are defined in variables.tf and terraform.tfvars
      TF_VAR_organization_name: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
      TF_VAR_private_key_path: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PATH }}


      # - variables that are defined in variables.tf and terraform.tfvars
      TF_VAR_login_name: ${{ secrets.TMP_LOGIN_NAME }}
      TF_VAR_first_name: ${{ secrets.TMP_FIRST_NAME }}
      TF_VAR_last_name: ${{ secrets.TMP_LAST_NAME }}
      TF_VAR_email: ${{ secrets.TMP_EMAIL }}
      TF_VAR_password:  ${{ secrets.TMP_PASSWORD }}
      TF_VAR_default_password: ${{ secrets.TMP_DEFAULT_PASSWORD }}


      # TF_VAR_private_key_path: ${{ secrets.private_key_path }}   
      # the GitHub runner is a fresh Linux container and does not have your local ~/.ssh/snowflake_tf_snow_key.p8 file.
      # Store the private key content as a GitHub Secret (e.g., SNOWFLAKE_TF_USER_PRIVATE_KEY), and add a step in your GitHub Actions workflow 
      # before terraform plan that writes that secret content into a temporary file on the runner:
      # - name: Create Private Key File
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.SNOWFLAKE_TF_USER_PRIVATE_KEY }}" > ~/.ssh/snowflake_tf_snow_key.p8
      #     chmod 600 ~/.ssh/snowflake_tf_snow_key.p8



    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x" # Matches your native S3 locking requirement

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Create Private Key File
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.ssh/snowflake_tf_snow_key.p8
          chmod 600 ~/.ssh/snowflake_tf_snow_key.p8


      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve


